<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Foliage — Recipe Finder</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f1a0f;--bg2:#162016;--bg3:#1e2e1e;--bg4:#253325;
  --surface:#2a3d2a;--surface2:#334d33;
  --cream:#f0e8d5;--cream2:#ddd0b5;
  --gold:#c9a84c;--gold2:#e2c47a;
  --moss:#6b8f5e;--moss2:#8fb880;
  --rust:#c46a3a;
  --text:#f0e8d5;--text2:#b8a98a;--text3:#7a6e58;
  --border:rgba(240,232,213,0.08);--border2:rgba(240,232,213,0.15);
  --r:10px;--r2:16px;
}
html{scroll-behavior:smooth}
body{font-family:'Jost',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");pointer-events:none;z-index:9999;opacity:.5}

/* NAV */
nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:0 2.5rem;height:64px;background:rgba(15,26,15,0.88);backdrop-filter:blur(18px);border-bottom:1px solid var(--border)}
.nav-logo{font-family:'Cormorant Garamond',serif;font-size:1.75rem;font-weight:700;color:var(--cream);letter-spacing:.04em}
.nav-logo span{color:var(--gold);font-style:italic}
.nav-links{display:flex;gap:2rem;list-style:none}
.nav-links a{font-size:.75rem;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--text2);text-decoration:none;transition:color .2s}
.nav-links a:hover{color:var(--cream)}

/* HERO */
.hero{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8rem 2rem 4rem;position:relative;overflow:hidden}
.hero-bg{position:absolute;inset:0;background:radial-gradient(ellipse 70% 55% at 50% 85%,rgba(107,143,94,.18) 0%,transparent 65%),radial-gradient(ellipse 40% 25% at 20% 15%,rgba(201,168,76,.08) 0%,transparent 60%),linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%)}
.hero-rings{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:800px;height:800px;pointer-events:none}
.hero-rings circle{fill:none;stroke:var(--moss);opacity:.05}
.eyebrow{position:relative;font-size:.72rem;font-weight:600;letter-spacing:.28em;text-transform:uppercase;color:var(--moss2);margin-bottom:1.2rem;display:flex;align-items:center;gap:.8rem}
.eyebrow::before,.eyebrow::after{content:'';display:block;width:30px;height:1px;background:var(--moss)}
.hero h1{position:relative;font-family:'Cormorant Garamond',serif;font-size:clamp(3rem,8vw,7rem);font-weight:600;line-height:1.0;color:var(--cream);letter-spacing:-.02em;margin-bottom:.3em}
.hero h1 em{color:var(--gold);font-style:italic}
.hero-sub{position:relative;font-size:1rem;font-weight:300;color:var(--text2);max-width:440px;line-height:1.7;margin-bottom:2.5rem}

/* SEARCH */
.search-container{position:relative;width:100%;max-width:640px;margin-bottom:1.5rem}
.search-wrap{display:flex;align-items:center;background:var(--bg3);border:1px solid var(--border2);border-radius:50px;overflow:hidden;transition:border-color .25s,box-shadow .25s}
.search-wrap:focus-within{border-color:var(--moss);box-shadow:0 0 0 3px rgba(107,143,94,.15)}
.search-wrap svg{margin-left:1.4rem;flex-shrink:0;stroke:var(--text3);transition:stroke .2s}
.search-wrap:focus-within svg{stroke:var(--moss2)}
#mainSearch{flex:1;border:none;outline:none;background:transparent;font-family:'Jost',sans-serif;font-size:1rem;color:var(--cream);padding:1rem .8rem}
#mainSearch::placeholder{color:var(--text3)}
#searchBtn{background:var(--gold);color:var(--bg);border:none;padding:0 1.8rem;height:52px;font-family:'Jost',sans-serif;font-size:.8rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;transition:background .2s,transform .15s;flex-shrink:0}
#searchBtn:hover{background:var(--gold2);transform:scale(1.02)}
#searchBtn:active{transform:scale(.97)}

/* QUICK TAGS */
.quick-tags{position:relative;display:flex;gap:.5rem;flex-wrap:wrap;justify-content:center}
.qtag{padding:.4rem 1rem;border-radius:50px;border:1px solid var(--border2);background:transparent;font-family:'Jost',sans-serif;font-size:.78rem;color:var(--text2);cursor:pointer;transition:all .2s}
.qtag:hover{border-color:var(--moss);color:var(--moss2);background:rgba(107,143,94,.08)}
.qtag.active{background:var(--moss);border-color:var(--moss);color:#fff}

/* FILTER BAR */
.filter-bar{background:var(--bg2);border-top:1px solid var(--border);border-bottom:1px solid var(--border);padding:1rem 2.5rem;display:flex;align-items:center;gap:1.5rem;flex-wrap:wrap}
.filter-group{display:flex;align-items:center;gap:.6rem}
.filter-label{font-size:.68rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--text3);white-space:nowrap}
.filter-select{background:var(--bg3);border:1px solid var(--border2);border-radius:6px;color:var(--text2);font-family:'Jost',sans-serif;font-size:.82rem;padding:.4rem .8rem;outline:none;cursor:pointer;transition:border-color .2s}
.filter-select:focus{border-color:var(--moss)}
.filter-select option{background:var(--bg3)}
.filter-divider{width:1px;height:24px;background:var(--border2);flex-shrink:0}
.diet-chips{display:flex;gap:.4rem;flex-wrap:wrap}
.dchip{padding:.3rem .75rem;border-radius:50px;border:1px solid var(--border2);background:transparent;font-family:'Jost',sans-serif;font-size:.75rem;color:var(--text2);cursor:pointer;transition:all .18s;user-select:none}
.dchip:hover{border-color:var(--gold);color:var(--gold)}
.dchip.active{background:var(--gold);border-color:var(--gold);color:var(--bg)}
.clear-btn{margin-left:auto;background:transparent;border:1px solid var(--border2);color:var(--text3);border-radius:6px;font-family:'Jost',sans-serif;font-size:.75rem;padding:.4rem .9rem;cursor:pointer;transition:all .2s}
.clear-btn:hover{border-color:var(--rust);color:var(--rust)}

/* MAIN */
main{max-width:1400px;margin:0 auto;padding:2.5rem 2.5rem 4rem}
.results-header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:1.8rem;flex-wrap:wrap;gap:1rem}
.results-title{font-family:'Cormorant Garamond',serif;font-size:1.6rem;font-weight:600;color:var(--cream)}
.results-title span{color:var(--gold)}
.sort-wrap{display:flex;align-items:center;gap:.6rem}
.sort-label{font-size:.7rem;color:var(--text3);text-transform:uppercase;letter-spacing:.12em}
.sort-select{background:var(--bg3);border:1px solid var(--border2);border-radius:6px;color:var(--text2);font-family:'Jost',sans-serif;font-size:.82rem;padding:.4rem .8rem;outline:none;cursor:pointer}
.sort-select option{background:var(--bg3)}

/* GRID */
.recipe-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1.5rem}
.recipe-card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r2);overflow:hidden;cursor:pointer;transition:transform .25s cubic-bezier(.34,1.4,.64,1),border-color .2s,box-shadow .25s;animation:fadeUp .4s ease both}
.recipe-card:hover{transform:translateY(-6px);border-color:var(--border2);box-shadow:0 16px 48px rgba(0,0,0,.4),0 0 0 1px rgba(107,143,94,.2)}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.card-thumb{position:relative;height:210px;overflow:hidden;background:var(--bg4)}
.card-emoji{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:5rem;background:linear-gradient(135deg,var(--bg4),var(--surface))}
.card-thumb-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(15,26,15,.7) 0%,transparent 50%)}
.card-badges{position:absolute;top:.75rem;left:.75rem;display:flex;gap:.35rem;flex-wrap:wrap}
.badge{font-size:.62rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:.22rem .55rem;border-radius:50px}
.badge-diet{background:rgba(107,143,94,.85);color:#fff}
.badge-time{background:rgba(15,26,15,.75);color:var(--text2)}
.badge-diff{background:rgba(201,168,76,.18);color:var(--gold2);border:1px solid rgba(201,168,76,.28)}
.card-fav{position:absolute;top:.7rem;right:.75rem;width:32px;height:32px;border-radius:50%;border:none;background:rgba(15,26,15,.65);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:.9rem;transition:all .2s}
.card-fav:hover{background:rgba(196,106,58,.8);transform:scale(1.1)}
.card-fav.loved{background:rgba(196,106,58,.85)}
.card-rating-pill{position:absolute;bottom:.75rem;right:.75rem;background:rgba(15,26,15,.75);backdrop-filter:blur(8px);border-radius:50px;padding:.3rem .65rem;font-size:.75rem;color:var(--gold2);font-weight:600;display:flex;align-items:center;gap:.25rem}
.card-body{padding:1.1rem 1.3rem 1.3rem}
.card-cuisine{font-size:.65rem;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--moss2);margin-bottom:.4rem}
.card-title{font-family:'Cormorant Garamond',serif;font-size:1.25rem;font-weight:600;line-height:1.25;color:var(--cream);margin-bottom:.45rem}
.card-desc{font-size:.8rem;color:var(--text3);line-height:1.55;margin-bottom:.9rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-meta{display:flex;gap:1.1rem;align-items:center;font-size:.77rem;color:var(--text2);border-top:1px solid var(--border);padding-top:.8rem}
.meta-item{display:flex;align-items:center;gap:.3rem}
.meta-item svg{opacity:.6}
.card-cals{margin-left:auto;font-size:.72rem;color:var(--text3)}
.card-cals strong{color:var(--gold);font-weight:600}

/* EMPTY */
.empty{text-align:center;padding:5rem 2rem;color:var(--text3);grid-column:1/-1}
.empty-icon{font-size:4rem;margin-bottom:1rem;opacity:.3}
.empty h3{font-family:'Cormorant Garamond',serif;font-size:1.8rem;color:var(--text2);margin-bottom:.5rem}
.empty p{font-size:.9rem;line-height:1.6}

/* MODAL */
.modal-overlay{position:fixed;inset:0;z-index:500;background:rgba(8,14,8,.82);backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;padding:1rem}
.modal-overlay.open{display:flex}
.modal{background:var(--bg3);border:1px solid var(--border2);border-radius:20px;max-width:780px;width:100%;max-height:90vh;overflow-y:auto;position:relative;animation:popIn .35s cubic-bezier(.34,1.4,.64,1) both;scrollbar-width:thin;scrollbar-color:var(--surface2) transparent}
@keyframes popIn{from{opacity:0;transform:scale(.88) translateY(20px)}to{opacity:1;transform:scale(1) translateY(0)}}
.modal-close{position:sticky;top:1rem;float:right;margin:1rem 1rem -44px 0;width:38px;height:38px;border-radius:50%;background:var(--surface2);border:none;color:var(--text2);font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;z-index:10}
.modal-close:hover{background:var(--rust);color:#fff}
.modal-hero{width:100%;height:280px;overflow:hidden;border-radius:20px 20px 0 0;background:linear-gradient(135deg,var(--bg4),var(--surface));display:flex;align-items:center;justify-content:center;font-size:8rem;position:relative}
.modal-hero-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(30,46,30,.95) 0%,transparent 55%)}
.modal-hero-bottom{position:absolute;bottom:1.2rem;left:1.8rem;right:1.8rem;display:flex;align-items:flex-end;justify-content:space-between;gap:1rem}
.modal-cuisine-badge{font-size:.65rem;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--moss2);margin-bottom:.4rem}
.modal-title{font-family:'Cormorant Garamond',serif;font-size:2rem;font-weight:700;color:var(--cream);line-height:1.1}
.modal-rating{font-size:1rem;color:var(--gold);white-space:nowrap;display:flex;align-items:center;gap:.3rem;flex-shrink:0;font-weight:600}
.modal-body{padding:1.5rem 2rem 2rem}
.modal-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:.75rem;margin-bottom:1.8rem}
.stat-card{background:var(--bg4);border-radius:var(--r);padding:.8rem;text-align:center;border:1px solid var(--border)}
.stat-val{font-family:'Cormorant Garamond',serif;font-size:1.4rem;font-weight:700;color:var(--cream)}
.stat-lbl{font-size:.62rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--text3);margin-top:2px}
.modal-section{margin-bottom:1.8rem}
.modal-section-title{font-family:'Cormorant Garamond',serif;font-size:1.2rem;font-weight:600;color:var(--cream);margin-bottom:1rem;padding-bottom:.5rem;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:.5rem}
.ingredient-grid{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.ingredient-item{display:flex;align-items:flex-start;gap:.6rem;font-size:.855rem;color:var(--text2);line-height:1.4;padding:.5rem .6rem;border-radius:6px;background:var(--bg4);border:1px solid var(--border)}
.ing-dot{width:8px;height:8px;min-width:8px;border-radius:50%;background:var(--moss);margin-top:.35rem}
.steps-list{list-style:none;display:flex;flex-direction:column;gap:1rem}
.step{display:flex;gap:1rem;align-items:flex-start;padding:1rem;border-radius:var(--r);background:var(--bg4);border:1px solid var(--border)}
.step-num{width:30px;height:30px;min-width:30px;border-radius:50%;background:linear-gradient(135deg,var(--moss),var(--moss2));display:flex;align-items:center;justify-content:center;font-size:.78rem;font-weight:700;color:#fff;flex-shrink:0}
.step-text{font-size:.875rem;color:var(--text2);line-height:1.6}
.nutrition-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:.75rem}
.nut-card{background:var(--bg4);border-radius:var(--r);border:1px solid var(--border);padding:.75rem;text-align:center}
.nut-val{font-size:1.2rem;font-weight:600;font-family:'Cormorant Garamond',serif;color:var(--gold)}
.nut-lbl{font-size:.62rem;text-transform:uppercase;letter-spacing:.1em;color:var(--text3);margin-top:2px}

::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--surface2);border-radius:3px}

.recipe-card:nth-child(1){animation-delay:.04s}.recipe-card:nth-child(2){animation-delay:.08s}
.recipe-card:nth-child(3){animation-delay:.12s}.recipe-card:nth-child(4){animation-delay:.16s}
.recipe-card:nth-child(5){animation-delay:.20s}.recipe-card:nth-child(6){animation-delay:.24s}
.recipe-card:nth-child(7){animation-delay:.28s}.recipe-card:nth-child(8){animation-delay:.32s}
.recipe-card:nth-child(9){animation-delay:.36s}.recipe-card:nth-child(10){animation-delay:.40s}
.recipe-card:nth-child(11){animation-delay:.44s}.recipe-card:nth-child(12){animation-delay:.48s}

@media(max-width:700px){
  nav{padding:0 1.2rem}.nav-links{display:none}
  .hero{padding:7rem 1.2rem 3rem}
  main{padding:1.5rem 1.2rem 3rem}
  .filter-bar{padding:1rem 1.2rem}
  .recipe-grid{grid-template-columns:1fr}
  .modal-stats{grid-template-columns:repeat(2,1fr)}
  .nutrition-grid{grid-template-columns:repeat(2,1fr)}
  .ingredient-grid{grid-template-columns:1fr}
  .modal-body{padding:1rem 1.2rem 1.5rem}
  .modal-title{font-size:1.4rem}
}
</style>
</head>
<body>

<!-- NAV -->
<nav>
  <div class="nav-logo">Fo<span>lia</span>ge</div>
  <ul class="nav-links">
    <li><a href="#">Discover</a></li>
    <li><a href="#">Collections</a></li>
    <li><a href="#">Cuisines</a></li>
    <li><a href="#">Favourites</a></li>
  </ul>
</nav>

<!-- HERO -->
<section class="hero">
  <div class="hero-bg"></div>
  <svg class="hero-rings" viewBox="0 0 800 800">
    <circle cx="400" cy="400" r="190"/>
    <circle cx="400" cy="400" r="295"/>
    <circle cx="400" cy="400" r="380"/>
  </svg>
  <p class="eyebrow">Advanced Recipe Finder</p>
  <h1>Cook with <em>intention,</em><br>eat with joy</h1>
  <p class="hero-sub">Search thousands of recipes by ingredient, cuisine, diet type, cook time, and more.</p>
  <div class="search-container">
    <div class="search-wrap">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input type="text" id="mainSearch" placeholder="Search by name, ingredient, or cuisine…" autocomplete="off"/>
      <button id="searchBtn">Search</button>
    </div>
  </div>
  <div class="quick-tags">
    <button class="qtag" data-q="pasta">🍝 Pasta</button>
    <button class="qtag" data-q="chicken">🍗 Chicken</button>
    <button class="qtag" data-q="soup">🍲 Soup</button>
    <button class="qtag" data-q="salad">🥗 Salad</button>
    <button class="qtag" data-q="dessert">🍫 Dessert</button>
    <button class="qtag" data-q="vegan">🌿 Vegan</button>
    <button class="qtag" data-q="seafood">🦐 Seafood</button>
    <button class="qtag" data-q="eggs">🍳 Eggs</button>
  </div>
</section>

<!-- FILTER BAR -->
<div class="filter-bar">
  <div class="filter-group">
    <span class="filter-label">Cuisine</span>
    <select class="filter-select" id="filterCuisine">
      <option value="">All</option>
      <option>Italian</option><option>Asian</option><option>Mexican</option>
      <option>Indian</option><option>Mediterranean</option>
      <option>American</option><option>French</option><option>Middle Eastern</option>
    </select>
  </div>
  <div class="filter-divider"></div>
  <div class="filter-group">
    <span class="filter-label">Time</span>
    <select class="filter-select" id="filterTime">
      <option value="">Any</option>
      <option value="15">≤ 15 min</option><option value="30">≤ 30 min</option>
      <option value="60">≤ 60 min</option><option value="90">≤ 90 min</option>
    </select>
  </div>
  <div class="filter-divider"></div>
  <div class="filter-group">
    <span class="filter-label">Difficulty</span>
    <select class="filter-select" id="filterDiff">
      <option value="">All</option>
      <option>Easy</option><option>Medium</option><option>Hard</option>
    </select>
  </div>
  <div class="filter-divider"></div>
  <div class="filter-group">
    <span class="filter-label">Diet</span>
    <div class="diet-chips" id="dietChips">
      <button class="dchip" data-diet="Vegetarian">Vegetarian</button>
      <button class="dchip" data-diet="Vegan">Vegan</button>
      <button class="dchip" data-diet="Gluten-Free">Gluten-Free</button>
      <button class="dchip" data-diet="Dairy-Free">Dairy-Free</button>
      <button class="dchip" data-diet="Keto">Keto</button>
    </div>
  </div>
  <button class="clear-btn" id="clearBtn">✕ Clear all</button>
</div>

<!-- MAIN CONTENT -->
<main>
  <div class="results-header">
    <h2 class="results-title">Showing <span id="countSpan">0</span> recipes</h2>
    <div class="sort-wrap">
      <span class="sort-label">Sort by</span>
      <select class="sort-select" id="sortSelect">
        <option value="rating">Top Rated</option>
        <option value="time">Quickest</option>
        <option value="cals">Lowest Calories</option>
        <option value="name">Name A–Z</option>
      </select>
    </div>
  </div>
  <div class="recipe-grid" id="recipeGrid"></div>
</main>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modal">
    <button class="modal-close" id="modalClose" aria-label="Close">✕</button>
    <div id="modalContent"></div>
  </div>
</div>

<script>
const RECIPES=[
  /* ── ITALIAN ── */
  {id:1,name:"Spaghetti Carbonara",cuisine:"Italian",emoji:"🍝",time:25,difficulty:"Medium",rating:4.8,cals:620,diet:["Vegetarian"],
   desc:"A classic Roman pasta with eggs, Pecorino Romano, guanciale, and freshly cracked black pepper. Silky, rich, and utterly satisfying.",
   ingredients:["400g spaghetti","200g guanciale","4 large eggs","100g Pecorino Romano","100g Parmesan","Freshly cracked black pepper","Coarse salt"],
   steps:["Bring a large pot of heavily salted water to a boil and cook spaghetti until al dente.","Slice guanciale into thick lardons and fry in a dry pan over medium heat until crispy and golden. Remove from heat.","Vigorously whisk eggs with grated Pecorino and Parmesan until combined.","Drain pasta, reserving at least 1 cup of pasta cooking water.","Add hot pasta directly to the guanciale pan off the heat. Toss to coat in the fat.","Pour egg mixture over pasta, tossing quickly. Add splashes of pasta water to emulsify into a glossy sauce.","Season with generous black pepper. Serve immediately in warmed bowls."],

// STATE
let state={query:'',cuisine:'',time:'',difficulty:'',diets:[],sort:'rating',favourites:new Set()};

// DOM
const grid=document.getElementById('recipeGrid');
const countSpan=document.getElementById('countSpan');
const modalOverlay=document.getElementById('modalOverlay');
const modalContent=document.getElementById('modalContent');
const modalClose=document.getElementById('modalClose');

function filterRecipes(){
  let r=[...RECIPES];
  const q=state.query.toLowerCase().trim();
  if(q) r=r.filter(x=>
    x.name.toLowerCase().includes(q)||
    x.cuisine.toLowerCase().includes(q)||
    x.desc.toLowerCase().includes(q)||
    x.ingredients.some(i=>i.toLowerCase().includes(q))||
    x.diet.some(d=>d.toLowerCase().includes(q))
  );
  if(state.cuisine) r=r.filter(x=>x.cuisine===state.cuisine);
  if(state.time) r=r.filter(x=>x.time<=+state.time);
  if(state.difficulty) r=r.filter(x=>x.difficulty===state.difficulty);
  if(state.diets.length) r=r.filter(x=>state.diets.every(d=>x.diet.includes(d)));
  const sorts={rating:(a,b)=>b.rating-a.rating,time:(a,b)=>a.time-b.time,cals:(a,b)=>a.cals-b.cals,name:(a,b)=>a.name.localeCompare(b.name)};
  r.sort(sorts[state.sort]);
  return r;
}

function renderGrid(){
  const results=filterRecipes();
  countSpan.textContent=results.length;
  grid.innerHTML='';
  if(!results.length){
    grid.innerHTML=`<div class="empty"><div class="empty-icon">🌿</div><h3>No recipes found</h3><p>Try adjusting your search terms or clearing some filters.</p></div>`;
    return;
  }
  results.forEach((r,i)=>{
    const loved=state.favourites.has(r.id);
    const card=document.createElement('div');
    card.className='recipe-card';
    card.style.animationDelay=`${i*0.05}s`;
    card.innerHTML=`
      <div class="card-thumb">
        <div class="card-emoji">${r.emoji}</div>
        <div class="card-thumb-overlay"></div>
        <div class="card-badges">
          ${r.diet.slice(0,2).map(d=>`<span class="badge badge-diet">${d}</span>`).join('')}
          <span class="badge badge-time">⏱ ${r.time}m</span>
          <span class="badge badge-diff">${r.difficulty}</span>
        </div>
        <button class="card-fav${loved?' loved':''}" data-id="${r.id}" title="Favourite">${loved?'❤️':'🤍'}</button>
        <div class="card-rating-pill">★ ${r.rating}</div>
      </div>
      <div class="card-body">
        <div class="card-cuisine">${r.cuisine}</div>
        <h3 class="card-title">${r.name}</h3>
        <p class="card-desc">${r.desc}</p>
        <div class="card-meta">
          <span class="meta-item">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
            ${r.time} min
          </span>
          <span class="meta-item">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
            ${r.difficulty}
          </span>
          <span class="card-cals"><strong>${r.cals}</strong> kcal</span>
        </div>
      </div>`;
    card.addEventListener('click',e=>{if(!e.target.closest('.card-fav'))openModal(r);});
    card.querySelector('.card-fav').addEventListener('click',e=>{
      e.stopPropagation();
      const btn=card.querySelector('.card-fav');
      if(state.favourites.has(r.id)){state.favourites.delete(r.id);btn.innerHTML='🤍';btn.classList.remove('loved');}
      else{state.favourites.add(r.id);btn.innerHTML='❤️';btn.classList.add('loved');}
    });
    grid.appendChild(card);
  });
}

function openModal(r){
  modalContent.innerHTML=`
    <div class="modal-hero">
      <div style="font-size:8rem;z-index:1;position:relative">${r.emoji}</div>
      <div class="modal-hero-overlay"></div>
      <div class="modal-hero-bottom">
        <div>
          <div class="modal-cuisine-badge">${r.cuisine}</div>
          <div class="modal-title">${r.name}</div>
        </div>
        <div class="modal-rating">★ ${r.rating}</div>
      </div>
    </div>
    <div class="modal-body">
      <div style="display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1rem">
        ${r.diet.map(d=>`<span class="badge badge-diet">${d}</span>`).join('')}
        <span class="badge badge-diff">${r.difficulty}</span>
      </div>
      <p style="font-size:.9rem;color:var(--text2);line-height:1.7;margin-bottom:1.5rem">${r.desc}</p>
      <div class="modal-stats">
        <div class="stat-card"><div class="stat-val">${r.time}m</div><div class="stat-lbl">Cook Time</div></div>
        <div class="stat-card"><div class="stat-val">${r.ingredients.length}</div><div class="stat-lbl">Ingredients</div></div>
        <div class="stat-card"><div class="stat-val">${r.steps.length}</div><div class="stat-lbl">Steps</div></div>
        <div class="stat-card"><div class="stat-val">${r.cals}</div><div class="stat-lbl">Calories</div></div>
      </div>
      <div class="modal-section">
        <div class="modal-section-title">🥕 Ingredients</div>
        <div class="ingredient-grid">
          ${r.ingredients.map(i=>`<div class="ingredient-item"><div class="ing-dot"></div><span>${i}</span></div>`).join('')}
        </div>
      </div>
      <div class="modal-section">
        <div class="modal-section-title">👨‍🍳 Method</div>
        <ol class="steps-list">
          ${r.steps.map((s,i)=>`<li class="step"><div class="step-num">${i+1}</div><div class="step-text">${s}</div></li>`).join('')}
        </ol>
      </div>
      <div class="modal-section">
        <div class="modal-section-title">📊 Nutrition (per serving)</div>
        <div class="nutrition-grid">
          <div class="nut-card"><div class="nut-val">${r.nutrition.cal}</div><div class="nut-lbl">Calories</div></div>
          <div class="nut-card"><div class="nut-val">${r.nutrition.protein}g</div><div class="nut-lbl">Protein</div></div>
          <div class="nut-card"><div class="nut-val">${r.nutrition.carbs}g</div><div class="nut-lbl">Carbs</div></div>
          <div class="nut-card"><div class="nut-val">${r.nutrition.fat}g</div><div class="nut-lbl">Fat</div></div>
        </div>
      </div>
    </div>`;
  modalOverlay.classList.add('open');
  document.body.style.overflow='hidden';
  document.getElementById('modal').scrollTop=0;
}

function closeModal(){modalOverlay.classList.remove('open');document.body.style.overflow='';}

// EVENTS
document.getElementById('mainSearch').addEventListener('keydown',e=>{
  if(e.key==='Enter'){state.query=e.target.value;renderGrid();}
});
document.getElementById('searchBtn').addEventListener('click',()=>{
  state.query=document.getElementById('mainSearch').value;
  renderGrid();
  document.querySelector('main').scrollIntoView({behavior:'smooth'});
});
document.querySelectorAll('.qtag').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.qtag').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    state.query=btn.dataset.q;
    document.getElementById('mainSearch').value=btn.dataset.q;
    renderGrid();
    document.querySelector('main').scrollIntoView({behavior:'smooth'});
  });
});
document.getElementById('filterCuisine').addEventListener('change',e=>{state.cuisine=e.target.value;renderGrid();});
document.getElementById('filterTime').addEventListener('change',e=>{state.time=e.target.value;renderGrid();});
document.getElementById('filterDiff').addEventListener('change',e=>{state.difficulty=e.target.value;renderGrid();});
document.getElementById('sortSelect').addEventListener('change',e=>{state.sort=e.target.value;renderGrid();});
document.querySelectorAll('.dchip').forEach(chip=>{
  chip.addEventListener('click',()=>{
    const d=chip.dataset.diet;
    chip.classList.toggle('active');
    if(state.diets.includes(d)) state.diets=state.diets.filter(x=>x!==d);
    else state.diets.push(d);
    renderGrid();
  });
});
document.getElementById('clearBtn').addEventListener('click',()=>{
  state={...state,query:'',cuisine:'',time:'',difficulty:'',diets:[],sort:'rating'};
  document.getElementById('mainSearch').value='';
  document.getElementById('filterCuisine').value='';
  document.getElementById('filterTime').value='';
  document.getElementById('filterDiff').value='';
  document.getElementById('sortSelect').value='rating';
  document.querySelectorAll('.dchip,.qtag').forEach(c=>c.classList.remove('active'));
  renderGrid();
});
modalClose.addEventListener('click',closeModal);
modalOverlay.addEventListener('click',e=>{if(e.target===modalOverlay)closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

renderGrid();
</script>
</body>
</html>
